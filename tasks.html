<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>وظایف اعضا - نشتی‌ها</title>

    body {
      font-family: Tahoma, sans-serif;
      direction: rtl;
      text-align: center;
      background-color: #f0f0f0;
      padding: 50px;
    }

    h2 {
      color: #2b5876;
    }

    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 90%;
      max-width: 800px;
    }

    th, td {
      border: 1px solid #888;
      padding: 10px;
    }

    th {
      background-color: #2b5876;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .back-button {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h2>لیست وظایف اعضا</h2>

  <table>
    <thead>
      <tr>
        <th>نام کاربر</th>
        <th>شرح وظیفه</th>
        <th>وضعیت</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>علی</td>
        <td>بررسی نشتی طبقه اول</td>
        <td>در حال انجام</td>
      </tr>
      <tr>
        <td>مینا</td>
        <td>گزارش وضعیت هفته جاری</td>
        <td>انجام شده</td>
      </tr>
      <tr>
        <td>رضا</td>
        <td>بازرسی شیرهای گاز</td>

  <a href="login.html" class="back-button">بازگشت به ورود</a>

</html>
